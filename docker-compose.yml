services:
  backend:
    build: ./backend
    container_name: taskmanager_backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_BACKEND_URL=http://backend:5001
    depends_on:
      - backend